version: "2"
sql:
  - engine: postgresql
    schema: ../blueprint/backend/db/migrations
    queries: db/queries
    gen:
      go:
        package: db
        out: internal/infrastructure/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: public.citext
            go_type:
              type: string
          - db_type: public.citext
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
