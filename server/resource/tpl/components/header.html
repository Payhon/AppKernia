{{define "header"}}<header class="site-header">{{if .IconURL}}<img class="brand-icon" src="{{.IconURL}}" alt="" width="28" height="28">{{end}}<span class="brand-name">{{.AppName}}</span><nav class="header-actions" aria-label="{{.T "page_actions"}}">{{if and .PromotionEnabled .DownloadURL (ne .Kind "download")}}<a class="header-download" href="{{.DownloadURL}}">{{if .PromotionButtonLabel}}{{.PromotionButtonLabel}}{{else}}{{.T "download"}}{{end}}</a>{{end}}{{if .OtherLanguageURL}}<a class="icon-button language-switch" href="{{.OtherLanguageURL}}" lang="{{if eq .Locale "zh-CN"}}en-US{{else}}zh-CN{{end}}" aria-label="{{.T "switch_language"}}" title="{{.T "switch_language"}}"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Zm0 0c2.2-2.3 3.4-5.3 3.4-9S14.2 5.3 12 3m0 18c-2.2-2.3-3.4-5.3-3.4-9S9.8 5.3 12 3M3.5 9h17m-17 6h17"/></svg><span class="sr-only">{{.T "other_language"}}</span></a>{{end}}</nav></header>{{end}}
