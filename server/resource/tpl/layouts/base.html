{{define "base"}}<!doctype html>
<html lang="{{.Locale}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>{{.Title}}</title><meta name="description" content="{{.Summary}}">{{if .Canonical}}<link rel="canonical" href="{{.Canonical}}"><meta property="og:url" content="{{.Canonical}}">{{end}}<meta property="og:title" content="{{.Title}}"><meta property="og:description" content="{{.Summary}}"><meta property="og:type" content="{{if eq .Kind "article"}}article{{else}}website{{end}}">{{if .ShareImageURL}}<meta property="og:image" content="{{.ShareImageURL}}">{{end}}<link rel="stylesheet" href="{{.CSS}}">{{if eq .Kind "download"}}<script type="module" src="{{.JS}}"></script>{{end}}{{if and (eq .Kind "article") .MediaJS}}<script type="module" src="{{.MediaJS}}"></script>{{end}}{{if .PreviewJS}}<script type="module" src="{{.PreviewJS}}"></script>{{end}}</head>
<body class="page-{{.Kind}}"{{if .PreviewOrigin}} data-preview-origin="{{.PreviewOrigin}}" data-preview-kind="{{.Kind}}"{{end}}><a class="skip-link" href="#main">{{.T "skip"}}</a>{{template "header" .}}{{template "content" .}}<footer class="site-footer"><span>{{.AppName}}</span></footer></body></html>{{end}}
