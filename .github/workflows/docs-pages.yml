name: Docs Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/ak-docs/**"
      - "server/openapi/openapi.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.18.1"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Check and build documentation
        run: pnpm --filter @appkernia/docs check
        env:
          DOCS_ORIGIN: ${{ steps.pages.outputs.origin }}
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/ak-docs/doc_build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
