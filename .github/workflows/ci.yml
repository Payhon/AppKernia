name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: make check-blueprints

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: server/go.sum
      - run: make -C server check

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v5
        with:
          node-version: "24.18.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @appkernia/admin check

  mobile-blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v5
        with:
          node-version: "24.18.1"
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ripgrep
      - run: pnpm install --frozen-lockfile
      - run: python3 blueprint/mobile/scripts/validate_blueprint_specs.py
      - run: python3 -m pip install -r apps/ak-mobile/scripts/requirements.txt
      - run: apps/ak-mobile/scripts/check-project.sh

  release-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.1"
      - run: node --test scripts/release.test.mjs
