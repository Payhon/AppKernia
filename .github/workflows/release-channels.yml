name: akone release channels

on:
  workflow_call:
    inputs:
      tag:
        description: Existing published GitHub release tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published GitHub release tag
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: akone-release
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.18.1"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download and verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node --input-type=module -e "import { normalizeVersion } from './scripts/release.mjs'; process.stdout.write(normalizeVersion(process.env.TAG))")"
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "release tag must use the canonical v$VERSION form" >&2
            exit 1
          fi
          if [[ "$VERSION" != *-* ]]; then
            echo "stable releases are blocked until macOS notarization and Windows Authenticode signing are implemented" >&2
            exit 1
          fi
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha + " " + .object.type')"
          read -r tag_sha tag_type <<<"$tag_object"
          if [[ "$tag_type" != "tag" ]] || [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.verification.verified')" != "true" ]]; then
            echo "$TAG must be an annotated tag with a GitHub-verified signature" >&2
            exit 1
          fi
          tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')"
          if [[ "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "$TAG does not resolve to the checked out commit" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "$TAG is not reachable from origin/main" >&2
            exit 1
          fi
          if [[ "$(gh release view "$TAG" --json isDraft,isPrerelease --jq '(.isDraft == false) and (.isPrerelease == true)')" != "true" ]]; then
            echo "$TAG is not a published release" >&2
            exit 1
          fi
          mkdir release-assets
          gh release download "$TAG" --dir release-assets
          (cd release-assets && sha256sum --check checksums.txt)
          {
            echo "VERSION=$VERSION"
            echo "NPM_TAG=preview"
            echo "STABLE=false"
          } >> "$GITHUB_ENV"

      - name: Stage and smoke-test npm packages
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-release-channels.mjs npm --version "$VERSION" --assets release-assets
          while IFS= read -r package_dir; do npm pack "$package_dir" --dry-run >/dev/null; done < dist/channels/npm/publish-order.txt
          dist/channels/npm/linux-x64/bin/akone version --json

      - name: Publish npm platform packages, then meta package
        env:
          NPM_CONFIG_PROVENANCE: "true"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then unset NODE_AUTH_TOKEN; fi
          while IFS= read -r package_dir; do
            package_name="$(node -p "require('./$package_dir/package.json').name")"
            package_state="$(node scripts/verify-npm-package.mjs --package-dir "$package_dir" --version "$VERSION")"
            case "$package_state" in
              matching) echo "$package_name@$VERSION already exists with matching integrity; skipping" ;;
              missing) npm publish "$package_dir" --access public --tag "$NPM_TAG" ;;
              *) echo "unexpected npm package state: $package_state" >&2; exit 1 ;;
            esac
          done < dist/channels/npm/publish-order.txt

      - name: Stage Homebrew Formula
        if: env.STABLE == 'true'
        run: |
          node scripts/stage-release-channels.mjs homebrew --version "$VERSION" --assets release-assets
          ruby -c dist/channels/homebrew-tap/Formula/akone.rb

      - name: Checkout Payhon Homebrew tap
        if: env.STABLE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Payhon/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Publish Homebrew Formula
        if: env.STABLE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          install -D -m 0644 dist/channels/homebrew-tap/Formula/akone.rb homebrew-tap/Formula/akone.rb
          cd homebrew-tap
          if git diff --quiet -- Formula/akone.rb; then
            echo "Formula/akone.rb is already current"
            exit 0
          fi
          git config user.name "appkernia-release[bot]"
          git config user.email "appkernia-release[bot]@users.noreply.github.com"
          git add Formula/akone.rb
          git commit -m "akone $VERSION"
          git push origin HEAD:main
