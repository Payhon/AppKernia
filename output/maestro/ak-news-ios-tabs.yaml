appId: com.appkernia.mobile
name: 应核资讯 App 四 Tab 冒烟验收
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "首页"
    timeout: 15000
- takeScreenshot: output/playwright/ak-news-ios-home-maestro
- tapOn: "浏览"
- assertVisible: "浏览"
- takeScreenshot: output/playwright/ak-news-ios-browse
- tapOn: "专题"
- assertVisible: "专题"
- takeScreenshot: output/playwright/ak-news-ios-topics
- tapOn: "我的"
- assertVisible: "我的"
- takeScreenshot: output/playwright/ak-news-ios-profile-guest
