appId: com.appkernia.mobile
name: 应核资讯 App 视频进度取证启动
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "首页"
    timeout: 15000
- tapOn: "浏览"
- waitForAnimationToEnd
- tapOn:
    point: "67%,31%"
- waitForAnimationToEnd
- tapOn:
    point: "50%,50%"
- waitForAnimationToEnd
- tapOn:
    point: "50%,74%"
- takeScreenshot: output/playwright/ak-news-ios-video-progress-start
