appId: com.appkernia.mobile
name: 应核资讯 App 搜索详情与分享验收
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "首页"
    timeout: 15000
- tapOn: "浏览"
- tapOn:
    point: "50%,19%"
- inputText: "AppKernia"
- pressKey: ENTER
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: output/playwright/ak-news-ios-search
- tapOn:
    point: "50%,53%"
- waitForAnimationToEnd
- takeScreenshot: output/playwright/ak-news-ios-article-detail
- tapOn:
    point: "75%,94%"
- waitForAnimationToEnd
- takeScreenshot: output/playwright/ak-news-ios-share-sheet
