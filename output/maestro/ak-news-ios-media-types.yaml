appId: com.appkernia.mobile
name: 应核资讯 App 图文与视频验收
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "首页"
    timeout: 15000
- assertNotVisible: "你没有访问权限"
- tapOn: "浏览"
- tapOn:
    point: "49%,29%"
- assertNotVisible: "你没有访问权限"
- waitForAnimationToEnd
- takeScreenshot: output/playwright/ak-news-ios-gallery-filter
- tapOn:
    point: "50%,53%"
- assertNotVisible: "你没有访问权限"
- waitForAnimationToEnd
- takeScreenshot: output/playwright/ak-news-ios-gallery-detail
- tapOn:
    point: "8%,10%"
- waitForAnimationToEnd
- tapOn:
    point: "67%,29%"
- assertNotVisible: "你没有访问权限"
- waitForAnimationToEnd
- takeScreenshot: output/playwright/ak-news-ios-video-filter
- tapOn:
    point: "50%,53%"
- assertNotVisible: "你没有访问权限"
- waitForAnimationToEnd
- takeScreenshot: output/playwright/ak-news-ios-video-detail
